server:
  port: 8082

spring:
  application:
    name: leopard-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # A new group on every start, reading from the beginning of the topic:
      # this is how the in-memory index is rebuilt after a restart.
      group-id: leopard-${random.uuid}
      auto-offset-reset: earliest

acl:
  service:
    url: http://localhost:8081
