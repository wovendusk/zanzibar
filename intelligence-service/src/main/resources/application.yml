server:
  port: 8083

spring:
  application:
    name: intelligence-service
  config:
    # Reads OPENAI_API_KEY from a .env file if there is one, in this directory
    # or the project root. A real environment variable works as well.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: zanzibar
    password: zanzibar
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: intelligence-audit
      auto-offset-reset: earliest

acl:
  service:
    url: http://localhost:8081

openai:
  base-url: https://api.openai.com/v1
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
