server:
  port: 8081

spring:
  application:
    name: acl-service
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: zanzibar
    password: zanzibar
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all

zanzibar:
  # Checks without a zookie are evaluated at the latest revision rounded down
  # to a multiple of this number. 1 = always the latest revision.
  quantum: 1
